<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HLS Security Probe</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
      --ok: #3ecf8e;
      --err: #f07178;
      --border: #2a3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a44, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    main { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; line-height: 1.45; }
    .card {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    textarea, input, select {
      width: 100%;
      background: #0c121b;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
    }
    input.club {
      font-size: 1rem;
      padding: 16px 18px;
    }
    .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
    @media (max-width: 720px) { .row { grid-template-columns: 1fr 1fr; } }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #041018;
      font-size: 1rem;
    }
    button.secondary { background: #243247; color: var(--text); font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: wait; }
    pre {
      background: #0c121b;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      max-height: 380px;
      font-size: 0.78rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 0; }
    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
    .pill.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--border)); }
    a { color: var(--accent); }
    code { color: #c3d4ef; }
    details { margin-top: 12px; color: var(--muted); }
    details summary { cursor: pointer; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>HLS Security Probe</h1>
    <p class="sub" id="subtitle">
      Paste a Hotmart club lesson link → click <strong>Download</strong>.
    </p>

    <section class="card">
      <label for="club">Club lesson URL</label>
      <input class="club" id="club" placeholder="https://hotmart.com/es/club/direito-cacd/products/2039476/content/64lK6nWbOj" />

      <div class="row">
        <div>
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="full" selected>Full download (1h)</option>
            <option value="clip">Short clip</option>
            <option value="probe">Probe only</option>
          </select>
        </div>
        <div>
          <label for="timeout">Timeout (sec)</label>
          <input id="timeout" type="number" value="3600" min="30" max="7200" />
        </div>
        <div>
          <label for="quality">Quality</label>
          <select id="quality">
            <option value="lowest" selected>Lowest (faster)</option>
            <option value="highest">Highest</option>
          </select>
        </div>
        <div>
          <label for="clipsec">Clip seconds</label>
          <input id="clipsec" type="number" value="5" min="1" max="600" />
        </div>
      </div>

      <div style="margin-top:12px">
        <label for="cdp">Browser CDP (auto prefers Brave)</label>
        <input id="cdp" value="auto" placeholder="auto" />
      </div>

      <div class="actions">
        <button id="btnDownload" type="button">Download</button>
        <button id="btnExtractOnly" class="secondary" type="button">Extract only</button>
      </div>

      <details>
        <summary>Advanced: paste embed / iframe instead</summary>
        <label for="snippet">Embed URL or iframe HTML</label>
        <textarea id="snippet" rows="5" placeholder="optional — if empty, club URL is extracted via Brave CDP"></textarea>
      </details>
    </section>

    <section class="card" id="jobCard" hidden>
      <div class="meta" id="jobMeta"></div>
      <p id="fileLink"></p>
      <label>Live log</label>
      <pre id="log"></pre>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let pollTimer = null;

    fetch("/api/config").then(r => r.json()).then(cfg => {
      $("cdp").value = cfg.cdp_auto ? "auto" : (cfg.brave_cdp || "auto");
      const sub = $("subtitle");
      const hint = cfg.login_hint || "Start ./bin/brave-debug.sh and log into Hotmart";
      const status = cfg.brave_ok
        ? '<span style="color:#3d7a4a">Brave CDP connected</span>'
        : '<span style="color:#a14a3a">Brave CDP offline</span>';
      sub.innerHTML =
        'Paste a club lesson URL → <strong>Download</strong>. ' +
        status + ' — ' + hint;
    }).catch(() => {});

    function detailError(data) {
      if (!data) return "request failed";
      if (typeof data.detail === "string") return data.detail;
      return JSON.stringify(data.detail || data);
    }

    async function poll(jobId) {
      const res = await fetch(`/api/jobs/${jobId}`);
      const job = await res.json();
      $("jobCard").hidden = false;
      const st = job.status === "ok" ? "ok" : job.status === "running" ? "" : "err";
      $("jobMeta").innerHTML = `
        <span class="pill ${st}">${job.status}</span>
        <span class="pill">${job.phase || ""}</span>
        <span class="pill">${job.mode || ""}</span>
        <span class="pill">${job.media || "…"}</span>
        <span class="pill">exit ${job.exit_code ?? "…"}</span>
      `;
      $("log").textContent = job.log_tail || "";
      $("log").scrollTop = $("log").scrollHeight;
      if (job.embed_src && !$("snippet").value) $("snippet").value = job.embed_src;
      if (job.output_file) {
        $("fileLink").innerHTML = `<a href="${job.output_file}" download>Download output file</a>`;
      }
      if (job.status === "running") {
        pollTimer = setTimeout(() => poll(jobId), 1200);
      }
    }

    $("btnDownload").onclick = async () => {
      const club = $("club").value.trim();
      const snippet = $("snippet").value.trim();
      if (!club && !snippet) {
        alert("Paste a club lesson URL (or an embed in Advanced)");
        return;
      }
      $("btnDownload").disabled = true;
      if (pollTimer) clearTimeout(pollTimer);
      $("fileLink").innerHTML = "";
      try {
        const res = await fetch("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            club_url: club || null,
            snippet: snippet || null,
            mode: $("mode").value,
            timeout_sec: Number($("timeout").value || 3600),
            quality: $("quality").value,
            seconds_clip: Number($("clipsec").value || 5),
            cdp: $("cdp").value.trim() || null,
            ref_override: club || null,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(detailError(data));
        await poll(data.job.id);
      } catch (e) {
        alert(e.message || e);
      } finally {
        $("btnDownload").disabled = false;
      }
    };

    $("btnExtractOnly").onclick = async () => {
      const club = $("club").value.trim();
      if (!club) {
        alert("Paste a club lesson URL first");
        return;
      }
      $("btnExtractOnly").disabled = true;
      try {
        const res = await fetch("/api/extract", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            club_url: club,
            cdp: $("cdp").value.trim() || null,
            timeout_ms: 180000,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(detailError(data));
        $("snippet").value = data.embed_src || "";
        $("jobCard").hidden = false;
        $("jobMeta").innerHTML = `<span class="pill ok">extracted</span><span class="pill">${data.vars?.media || ""}</span>`;
        $("log").textContent = data.embed_src || "";
        $("fileLink").innerHTML = "";
      } catch (e) {
        alert(e.message || e);
      } finally {
        $("btnExtractOnly").disabled = false;
      }
    };

    $("club").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("btnDownload").click();
    });
  </script>
</body>
</html>
